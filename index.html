<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Polygon Nexus AGI - لوحة التحكم المغلقة</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; text-align: center; padding: 5px; }
        .dashboard { max-width: 700px; margin: 50px auto; background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 10px; }
        h1 { color: #58a6ff; }
        .metric { font-size: 2rem; color: #56d364; font-weight: bold; margin: 20px 0; }
        .log-box { background: #0d1117; padding: 15px; border-radius: 5px; border: 1px solid #30363d; text-align: right; }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>🌌 نظام Polygon Nexus داخل GitHub</h1>
    <p>المحفظة النشطة: <br><strong style="color: #58a6ff;">0xa3dCED521c887C5b46e77F807330097245d80E35</strong></p>
    <hr style="border-color: #30363d;">
    
    <h3>📊 الأرباح التراكمية الحية للبوت:</h3>
    <div class="metric" id="earnings">$0.00 USD</div>
    
    <p>آخر تحديث تلقائي قام به بايثون: <span id="time" style="color: #ff7b72;">--:--:--</span></p>
    
    <div class="log-box">
        <strong>🧠 آخر تقرير ذكي أصدره البوت بشكل مستقل:</strong>
        <p id="log">جاري تحميل البيانات الحية من خوادم GitHub...</p>
    </div>
</div>

<script>
// دالة تقرأ ملف stats.json الذي قام بايثون بتحديثه وحفظه في المستودع
async function loadStats() {
    try {
        const res = await fetch('stats.json?t=' + new Date().getTime());
        const data = await res.json();
        document.getElementById("earnings").innerText = "$" + data.total_earnings.toFixed(2) + " USD";
        document.getElementById("time").innerText = data.last_update;
        document.getElementById("log").innerText = data.latest_log;
    } catch(e) {
        document.getElementById("log").innerText = "انتظر أول تشغيل تلقائي لملف بايثون لتوليد البيانات الحية.";
    }
}
window.onload = loadStats;
</script>
</body>
</html>
